#!/usr/sbin/nft -f
# Debian's standard /etc/nftables.conf (loaded by nftables.service at boot),
# with the stock example table replaced by the console-managed ruleset.
flush ruleset
include "/etc/sbxfw/ruleset.nft"
# The generated input chain includes a tailnet peer rule (tailscale0, TCP 9761) in
# console/sbx_console.py's render_ruleset(). It is intentionally not repeated here:
# this file only loads the rendered ruleset, which the console recreates on every apply.
