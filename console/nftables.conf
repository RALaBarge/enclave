#!/usr/sbin/nft -f
# Debian's standard /etc/nftables.conf (loaded by nftables.service at boot),
# with the stock example table replaced by the console-managed ruleset.
flush ruleset
include "/etc/sbxfw/ruleset.nft"

# ---- Tailscale (task 7): what the generated rules already do, and the one rule still missing -------------------------
#
# This is a CORE input rule, not a session/build profile rule: the profiles only decide what the sandbox may send
# through the forward chain. Nothing here touches forwarding.
#
# tailscaled itself needs no input rule. Its control-plane (TCP 443) and WireGuard (UDP 41641) flows are
# outbound-initiated, and the generated input chain accepts `ct state established,related`, so replies get in. The
# core's output chain is `policy accept`, so the daemon can reach the control plane and DERP as installed.
#
# Peer messaging does need one. harness/bridge/peers.py binds the pi-bridge peer listener to this node's tailnet
# address on TCP 9761, so an inbound tailnet connection is `ct state new` arriving on `tailscale0`. The generated
# input chain is default-deny and has no interface rule, so that connection is dropped (and logged as "sbxfw-drop"
# by the rate-limited log rule, so it is visible in the console's Blocked attempts table, not silent).
#
# The minimum rule, which belongs INSIDE the generated input chain (after `ct state invalid drop`, before the final
# log/drop line):
#
#     iifname "tailscale0" tcp dport 9761 accept comment "tailnet peers (pi-bridge; peers off by default)"
#
# It is scoped to the tailnet interface and to the peer port only, so it does not widen what the sandbox can reach:
# the forward chain stays default-deny (tailscale0 is not in `sbx_ifaces`, and nothing is forwarded unless the operator
# allows the destination), the sandbox's traffic is never masqueraded onto the tailnet, `tailscaled` accepts no subnet
# routes (no --accept-routes), and the bridge's local API on 127.0.0.1:9760 is not exposed by this rule.
#
# It is deliberately NOT added in this file. This file only loads /etc/sbxfw/ruleset.nft, which
# console/sbx_console.py renders and rewrites on every Apply (and on a profile switch), deleting and recreating
# `table inet sbxfw`; an `add rule ...` after the include would work at boot and then vanish at the next Apply,
# which is a silent regression. A second table with its own input base chain cannot fix it either: a packet is
# traversed by every base chain registered on the input hook, so `accept` in one chain does not stop the generated
# chain from dropping it. The durable fix is the input-chain template in console/sbx_console.py's render_ruleset(),
# which this change is not allowed to edit; the exact rule and its placement are recorded here so that change is a
# one-line edit.
