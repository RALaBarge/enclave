# Drop-in for nftables.service, installed as /etc/systemd/system/nftables.service.d/sbx-forward.conf by image/provision.sh.
# The core forwards the sandbox box's traffic only while the console's filter is live. Boot leaves forwarding off
# (/etc/sysctl.d/90-sbx-gateway.conf sets it to 0); it is switched on here, after /etc/nftables.conf has loaded and
# table inet sbxfw is listed back. If the ruleset fails to load (a corrupt or half-written ruleset.nft), nft -f
# applies nothing at all, this never runs, and the core routes nothing instead of routing everything unfiltered.
# Stopping nftables flushes the ruleset, so forwarding goes off again first.
[Service]
ExecStartPost=/bin/sh -c '/usr/sbin/nft list table inet sbxfw >/dev/null && echo 1 > /proc/sys/net/ipv4/ip_forward'
ExecStop=
ExecStop=/bin/sh -c 'echo 0 > /proc/sys/net/ipv4/ip_forward'
ExecStop=/usr/sbin/nft flush ruleset
