bber this, or vice versa.","parent":"PostgresStore","test":false,"nested":false,"module_use":true,"callers":6,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/store_postgres.go#PostgresStore.Get@147","file":"deskbox/cmd/agent-desk/store_postgres.go","name":"Get","kind":"method","line":147,"end":164,"sig":"func (s *PostgresStore) Get(id string) (*Job, bool, error) {","doc":"Get fetches a job by id. The bool return distinguishes \"not found\" from an error so callers don't have to sniff sql.ErrNoRows themselves.","parent":"PostgresStore","test":false,"nested":false,"module_use":true,"callers":12,"callees":1,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/store_postgres.go#PostgresStore.LoadIncomplete@165","file":"deskbox/cmd/agent-desk/store_postgres.go","name":"LoadIncomplete","kind":"method","line":165,"end":187,"sig":"func (s *PostgresStore) LoadIncomplete() ([]*Job, error) {","doc":"LoadIncomplete returns every job left \"queued\" or \"running\" from a prior process lifetime \u2014 the set that must be resumed on startup so a desk restart doesn't silently drop or duplicate work already accepted.","parent":"PostgresStore","test":false,"nested":false,"module_use":true,"callers":2,"callees":3,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/store_postgres.go#PostgresStore.ListTerminalUnacked@188","file":"deskbox/cmd/agent-desk/store_postgres.go","name":"ListTerminalUnacked","kind":"method","line":188,"end":214,"sig":"func (s *PostgresStore) ListTerminalUnacked(limit int) ([]*Job, error) {","doc":"ListTerminalUnacked returns terminal jobs the operator hasn't acked yet, most-recently-finished first \u2014 the inbox behind GET /jobs and GET /jobs/wait-any.","parent":"PostgresStore","test":false,"nested":false,"module_use":true,"callers":4,"callees":3,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/store_postgres.go#PostgresStore.ListByBatch@215","file":"deskbox/cmd/agent-desk/store_postgres.go","name":"ListByBat ring, error) {","doc":"HashFile returns the hex SHA-256 of a file, streaming rather than reading it whole: a tool may legitimately vendor a large static binary as its run target, and the hash should not be the thing that needs it all in memory. Shared so the desk (per-job integrity check) and tcs-verify (offline check) hash a file the exact same way.","parent":null,"test":false,"nested":false,"module_use":true,"callers":0,"callees":0,"tested":false,"unused":false},{"id":"deskbox/internal/tcs/interp.go#Executable@21","file":"deskbox/internal/tcs/interp.go","name":"Executable","kind":"function","line":21,"end":27,"sig":"func Executable(p string) bool {","doc":"Executable reports whether p is a regular (or symlinked-to-regular) executable file. Stat, not Lstat: /usr/bin/python3 is normally a symlink.","parent":null,"test":false,"nested":false,"module_use":true,"callers":1,"callees":0,"tested":true,"unused":false},{"id":"deskbox/internal/tcs/interp.go#LookPathIn@28","file":"deskbox/internal/tcs/interp.go","name":"LookPathIn","kind":"function","line":28,"end":50,"sig":"func LookPathIn(name, path string) (string, error) {","doc":"LookPathIn is exec.LookPath against a supplied PATH instead of the process's own. A name containing a slash is used as given, exactly as execve treats it.","parent":null,"test":false,"nested":false,"module_use":true,"callers":2,"callees":1,"tested":true,"unused":false},{"id":"deskbox/internal/tcs/interp.go#ShebangInterpreter@51","file":"deskbox/internal/tcs/interp.go","name":"ShebangInterpreter","kind":"function","line":51,"end":88,"sig":"func ShebangInterpreter(runPath string) (string, bool) {","doc":"ShebangInterpreter returns the program the kernel will actually exec for a script. \"#!/usr/bin/env python3\" resolves to python3 rather than env, since env is never the thing that's missing. A file with no shebang (a compiled binary) reports (\"\", false): it has no interpreter to depend on or pin.","parent":null,"test":false,"nested":false,"module_use":true,"callers":2,"callees":0,"tested":true,"unused":false},{"id":"deskbox/internal/tcs/interp.go#ResolveInterpreter@89","file":"deskbox/internal/tcs/interp.go","name":"ResolveInterpreter","kind":"function","line":89,"end":100,"sig":"func ResolveInterpreter(runPath, path string) (name, resolved string, ok bool) {","doc":"ResolveInterpreter returns the interpreter a run script will actually be executed by, resolved the way a job will find it: the shebang's program, looked up against path (normally SandboxPath). A compiled binary has no shebang and reports ok=false \u2014 interpreter pinning does not apply to it. name is the interpreter as written even when it can't be resolved, so a caller can report which one was missi","parent":null,"test":false,"nested":false,"module_use":true,"callers":1,"callees":2,"tested":true,"unused":false},{"id":"deskbox/internal/tcs/interp_test.go#TestShebangInterpreter@9","file":"deskbox/internal/tcs/interp_test.go","name":"TestShebangInterpreter","kind":"function","line":9,"end":45,"sig":"func TestShebangInterpreter(t *testing.T) {","doc":"","parent":null,"test":true,"nested":false,"module_use":false,"callers":0,"callees":1,"tested":false,"unused":false},{"id":"deskbox/internal/tcs/interp_test.go#TestLookPathInIgnoresHostPath@46","file":"deskbox/internal/tcs/interp_test.go","name":"TestLookPathInIgnoresHostPath","kind":"function","line":46,"end":73,"sig":"func TestLookPathInIgnoresHostPath(t *testing.T) {","doc":"TestLookPathInIgnoresHostPath is the point of having a custom lookup at all: resolving against the operator's PATH would \"find\" a runtime in ~/bin that no job can ever reach, and report a box as ready when it is not.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":1,"tested":false,"unused":false},{"id":"deskbox/internal/tcs/interp_test.go#TestResolveInterpreter@74","file":"deskbox/internal/tcs/interp_test.go","name":"TestResolveInterpreter","kind":"function","line":74,"end":98,"sig":"fun   // ---------- layout: branches spread sideways, leaves stack in columns under their parent

  function measure(id) {

  }
  function place(id, x, y) {

    if (before && P.get(anchor)) { tx = before.x - P.get(anchor).x * k; ty = before.y - P.get(anchor).y * k; apply(); }
    const sel = state.sel && P.has(state.sel) ? state.sel : null;

    const pr = partners(sel);

      const color = n.t === "root" ? ACCENT : AREA[n.area] || "#9aa7bb";
      const cls = ["tn", "t-" + n.t, n.test ? "test" : "", n.unused ? "unused" : "", id === sel ? "sel" : "", onPath.has(id) ? "on-path" : "",
        pr.out.has(id) ? "p-out" : "", pr.in.has(id) ? "p-in" : ""].filter(Boolean).join(" ");
      const name = n.t === "sym" && n.parent && get(par.get(id)).t !== "sym" ? n.parent + "." + n.name : n.name;
      const badge = pr.out.has(id) ? `<span class="tn-badge out">→${pr.out.get(id)}<\/span>` : pr.in.has(id) ? `<span class="tn-badge in">←${pr.in.get(id)}<\/span>` : "";
      h += `<button class="${cls}" data-id="${esc(id)}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;--c:${color}"` +
        (dk ? ` aria-expanded="${isOpen ? "true" : "false"}"` : "") + ` title="${esc(n.path && n.t !== "file" ? n.path + (n.line ? ":" + n.line : "") : n.path || n.name)}">` +
        `<span class="tn-name">${esc(name)}<\/span><span class="tn-meta">${esc(meta(n, id))}<\/span>` +

    render(); centerOn(id); return true;

  }, { passive: false });

    const b = e.target.closest("[data-t]"); if (!b) return;
    const r = visRect(), t = b.dataset.t;

    if (state.view !== "tree" || quiet) return;
    if (!id || !reveal(id)) render();
  };
  const engineSetView = setView;
  let prev = null, first = true;
  setView = function (v) {
    if (v === "tree") {
      if (state.view === "tree") return;
      prev = state.view;
      document.body.classList.remove("linear");
      state.view = "tree";
      document.body.classList.add("tree");
      pause3d(); press("tree");
      const tip = $("tip"); if (tip) tip.hidden = true;
      $("viewNote").textContent = NOTE;
      try { history.replaceState(null, "", "#tree"); } catch (e) {}
      if (state.sel && !P.has(state.sel) && par.has(state.sel)) for (let x = par.get(state.sel); x; x = par.get(x)) open.add(x);
      render();
      if (first) { first = false; fit(0); } else if (state.sel && P.has(state.sel)) centerOn(state.sel, 0);
      return;
    }
    if (state.view !== "tree") return engineSetView(v);
    document.body.classList.remove("tree");
    resume3d();
    state.view = prev;
    if (prev === "linear") document.body.classList.add("linear");
    try { history.replaceState(null, "", prev === "linear" ? "#linear" : location.pathname + location.search); } catch (e) {}
    if (v === prev && v !== "explore") {
      press(v);
      if (typeof NOTES !== "undefined" && NOTES[v]) $("viewNote").textContent = NOTES[v];
    } else engineSetView(v);
    if (typeof resize === "function") resize();
  };

  // filters in the rail re-draw the tree
  const later = () => { if (state.view === "tree") setTimeout(() => render(), 0); };
  $("rail").addEventListener("change", later);
  const lg = $("legend"); if (lg) lg.addEventListener("click", later);
  addEventListener("resize", () => { if (state.view === "tree") apply(); });
  addEventListener("keydown", (e) => {
    if (state.view !== "tree" || e.target.closest("input, textarea")) return;
    if (e.key === "Escape" && state.sel && !(document.getElementById("code") && !document.getElementById("code").hidden)) { quiet = true; select(null); render(); quiet = false; }
    if (e.key === "0" && !e.metaKey && !e.ctrlKey) fit();
  });

  if ((typeof ATLAS_START_HASH === "string" ? ATLAS_START_HASH : location.hash) === "#tree") setView("tree");
})();
</script><!--/TREE-->
