<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Enclave Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one 3D field filling the screen; a control rail on the left, an inspector drawer on the right,
   both floating over the field like instrument panels. Deliberately single-theme (night survey chart). */
:root {
  color-scheme: dark;
  --ink: #0d131d;          /* field */
  --panel: #141c29ee;      /* floating panels */
  --panel-solid: #141c29;
  --line: #2a3648;
  --fg: #e6e9ef;
  --mut: #8c98ab;
  --accent: #f0c36a;       /* brass: selection, focus */
  --ok: #7fc98a; --warn: #e6a35a; --bad: #e57373;
  --a-console: #e8a646; --a-harness: #45b8a9; --a-image: #7397db; --a-sbx: #e2795d;
  --a-tools: #b08de3; --a-common: #cdbb8c; --a-root: #9aa7bb; --a-deskbox: #84c26f; --a-runtime: #f4efe2;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace;
  --label-bg: #0d131de0;   /* label backing: the field, nearly opaque */
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font: 13px/1.45 var(--f-body); overflow: hidden; }
#graph { position: fixed; inset: 0; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; will-change: transform; transform: translate(-50%, -140%); white-space: nowrap; font: 700 12px/1.2 var(--f-body);
       color: var(--fg); background: var(--label-bg); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; }
.lbl.area { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; border-color: currentColor; padding: 3px 8px; }
.lbl.rt { color: var(--a-runtime); font: 500 12px/1.2 var(--f-mono); border-color: #f4efe244; }
.panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
         backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#rail { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); width: 300px;
        max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        display: flex; flex-direction: column; overflow: hidden; }
.rail-scroll { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font: 700 22px/1.05 var(--f-display); letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.meta { font: 11px/1.4 var(--f-mono); color: var(--mut); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat b { display: block; font: 600 17px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 10px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
.eyebrow { font: 600 10px/1 var(--f-display); text-transform: uppercase; letter-spacing: .12em; color: var(--mut); }
.group { display: flex; flex-direction: column; gap: 7px; }
input[type=search] { width: 100%; box-sizing: border-box; background: var(--ink); color: var(--fg); border: 1px solid var(--line);
  border-radius: 4px; padding: 7px 9px; font: 13px var(--f-body); }
input[type=search]:focus-visible, button:focus-visible, .chk:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
#results { display: flex; flex-direction: column; max-height: 220px; overflow-y: auto; }
#results button, .linklist button { all: unset; cursor: pointer; display: flex; gap: 8px; align-items: baseline; padding: 4px 6px;
  border-radius: 3px; min-width: 0; }
#results button:hover, .linklist button:hover, #results button:focus-visible, .linklist button:focus-visible { background: #ffffff12; }
.rname { font: 500 12px var(--f-mono); color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rpath { font: 10.5px var(--f-mono); color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.views { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.views button { background: var(--ink); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 4px; cursor: pointer;
  font: 600 12px var(--f-display); letter-spacing: .03em; }
.views button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; }
.chk input { accent-color: var(--accent); margin: 0; }
.chk small { color: var(--mut); margin-left: auto; font: 11px var(--f-mono); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
.legend button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 7px; font-size: 12px; padding: 2px 0; }
.legend button[aria-pressed=false] { opacity: .35; }
.sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.shape-note { font-size: 11.5px; color: var(--mut); }
#drawer { top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: 380px;
  max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.dr { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.dr-head { display: flex; align-items: flex-start; gap: 8px; }
.dr-head h2 { margin: 0; font: 600 18px/1.15 var(--f-mono); word-break: break-word; flex: 1; min-width: 0; }
.x { all: unset; cursor: pointer; color: var(--mut); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 3px; }
.x:hover { color: var(--fg); background: #ffffff12; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font: 600 10.5px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px;
  border: 1px solid var(--line); color: var(--mut); }
.chip.fix { color: var(--ok); border-color: #7fc98a66; }
.chip.unused { color: var(--bad); border-color: #e5737366; }
.chip.untested { color: var(--warn); border-color: #e6a35a66; }
.chip.tested { color: var(--ok); border-color: #7fc98a44; }
.loc { font: 12px var(--f-mono); color: var(--accent); word-break: break-all; }
pre.sig { margin: 0; padding: 8px 10px; background: var(--ink); border: 1px solid var(--line); border-radius: 4px;
  font: 12px/1.45 var(--f-mono); white-space: pre-wrap; word-break: break-word; }
.doc { color: var(--fg); max-width: 65ch; }
.note { color: var(--mut); font-size: 12px; }
.fixnote { border-left: 2px solid var(--ok); padding-left: 9px; color: var(--fg); }
.linklist { display: flex; flex-direction: column; max-height: 260px; overflow-y: auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; }
.kv dt { color: var(--mut); } .kv dd { margin: 0; font-family: var(--f-mono); word-break: break-word; }
#tip { position: fixed; pointer-events: none; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 4px;
  padding: 5px 8px; font: 12px var(--f-mono); max-width: 340px; z-index: 5; }
#tip[hidden] { display: none; }
#tip small { display: block; color: var(--mut); font-size: 10.5px; }
#railToggle { display: none; }
.findings .row { display: flex; gap: 8px; align-items: baseline; }
.findings .n { font: 600 15px var(--f-display); font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; }
.findings button.link { all: unset; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.findings button.link:hover { text-decoration-color: var(--accent); }
.lbl.file { font: 500 12px/1.2 var(--f-mono); }
.lbl.sym { font: 400 11.5px/1.2 var(--f-mono); color: #c9d1dd; border-color: #2a364899; }
.lbl.focus { color: var(--accent); border-color: var(--accent); font-size: 14px; font-weight: 600; z-index: 1; }
#rail, #drawer { max-height: calc(100% - 96px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
#crumbs { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 900px; padding: 8px 10px;
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; }
#crumbs .back { all: unset; cursor: pointer; grid-row: span 2; width: 34px; height: 34px; border-radius: 4px; border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 16px; color: var(--fg); }
#crumbs .back:disabled { opacity: .3; cursor: default; }
#crumbs .back:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
#crumbs .trail { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; min-width: 0; font: 500 13px var(--f-mono); }
#crumbs .trail button { all: unset; cursor: pointer; color: var(--mut); border-bottom: 1px dotted var(--line); }
#crumbs .trail button:hover, #crumbs .trail button:focus-visible { color: var(--fg); border-bottom-color: var(--accent); }
#crumbs .here { color: var(--accent); font-weight: 600; word-break: break-word; }
#crumbs .sep { color: var(--line); }
#crumbs .hint { font-size: 11.5px; color: var(--mut); min-width: 0; }
#crumbs .hint b { color: var(--fg); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) {
  #drawer { bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important; max-height: 38% !important; }
  #crumbs .hint { display: none; }
  #rail { width: auto; right: max(12px, env(safe-area-inset-right, 0px)); max-height: 46%; }
  #rail.collapsed .rail-scroll > :not(.always) { display: none; }
  #railToggle { display: inline-block; }
  #drawer { top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); width: auto; max-height: 48%; }
  .lbl:not(.area) { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div id="graph" aria-label="3D map of the Enclave project, explored in layers"></div>
<div id="labels" aria-hidden="true"></div>
<div id="tip" hidden></div>

<aside id="rail" class="panel">
  <div class="rail-scroll">
    <div class="always" style="display:flex;gap:8px;align-items:flex-start">
      <div style="flex:1;min-width:0">
        <h1>Enclave <span>Atlas</span></h1>
        <div class="meta" id="meta"></div>
      </div>
      <button id="railToggle" class="x" aria-label="Show or hide controls">☰</button>
    </div>
    <div class="stats always" id="stats"></div>
    <div class="group always">
      <label class="eyebrow" for="q">Find any file, function or service</label>
      <input id="q" type="search" placeholder="fw_lockdown, broker.sock, netcheck…" autocomplete="off">
      <div id="results" role="listbox" aria-label="Search results"></div>
    </div>
    <div class="group">
      <div class="eyebrow">View</div>
      <div class="views" role="group" aria-label="View">
        <button data-view="explore" aria-pressed="true">Layers</button>
        <button data-view="all" aria-pressed="false">Everything</button>
        <button data-view="findings" aria-pressed="false">Findings</button>
      </div>
      <div class="views" style="grid-template-columns:1fr 1fr"><button id="flat" aria-pressed="false">Flatten to top-down</button><button id="collapse" aria-pressed="false">Collapse into files</button></div>
      <div class="shape-note" id="viewNote"></div>
    </div>
    <div class="group">
      <div class="eyebrow">Layers</div>
      <label class="chk"><input type="checkbox" id="l-calls" checked> Calls between functions <small id="c-calls"></small></label>
      <label class="chk"><input type="checkbox" id="l-tests" checked> Test code <small id="c-tests"></small></label>
      <label class="chk"><input type="checkbox" id="l-runtime" checked> Runtime (services, sockets, machines) <small id="c-rt"></small></label>
      <label class="chk"><input type="checkbox" id="l-dbx" checked> deskbox (Go, pinned) <small id="c-dbx"></small></label>
    </div>
    <div class="group">
      <div class="eyebrow">Areas</div>
      <div class="legend" id="legend"></div>
      <div class="shape-note">Big spheres are areas, then components, then files; the smallest are functions, methods and classes. Hover for a name, click to inspect.</div>
    </div>
    <div class="group findings" id="findings"></div>
  </div>
</aside>

<nav id="crumbs" class="panel" hidden aria-label="Layer trail"></nav>
<aside id="drawer" class="panel" hidden><div class="dr" id="dr"></div></aside>

ame as loadDotenv's handling of a missing .env.","parent":null,"test":false,"nested":false,"module_use":true,"callers":1,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/executor.go#cappedBuffer@55","file":"deskbox/cmd/agent-desk/executor.go","name":"cappedBuffer","kind":"type","line":55,"end":60,"sig":"type cappedBuffer struct {","doc":"cappedBuffer accumulates up to max bytes, then drops the rest while still reporting success to the writer \u2014 a tool that overruns gets a clean contract violation rather than an EPIPE mid-write, and the desk's heap stays bounded regardless of what the tool does.","parent":null,"test":false,"nested":false,"module_use":true,"callers":0,"callees":0,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/executor.go#cappedBuffer.Write@61","file":"deskbox/cmd/agent-desk/executor.go","name":"Write","kind":"method","line":61,"end":72,"sig":"func (b *cappedBuffer) Write(p []byte) (int, error) {","doc":"","parent":"cappedBuffer","test":false,"nested":false,"module_use":false,"callers":2,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/executor.go#cappedBuffer.String@73","file":"deskbox/cmd/agent-desk/executor.go","name":"String","kind":"method","line":73,"end":89,"sig":"func (b *cappedBuffer) String() string { return b.buf.String() }","doc":"","parent":"cappedBuffer","test":false,"nested":false,"module_use":false,"callers":7,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/executor.go#bakeSandbox@90","file":"deskbox/cmd/agent-desk/executor.go","name":"bakeSandbox","kind":"function","line":90,"end":111,"sig":"func bakeSandbox(tool *Tool, inDir, outDir, toolDir string, toolEnv []string) ([]string, error) {","doc":"bakeSandbox builds the bwrap argv for a tool run.  The sandbox layer is minimal by construction. Inside it, the tool sees:  /deskbox/in/    \u2014 ONLY the files declared in sandbox.in (each bound                   read-only individually: the tool cannot even list                   siblings it wasn't given) /deskbox/out/   \u2014 the writable output dir (host-tailable: the operator                   can `ta","parent":null,"test":false,"nested":false,"module_use":true,"callers":1,"callees":1,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/executor.go#sandboxArgs@112","file":"deskbox/cmd/agent-desk/executor.go","name":"sandboxArgs","kind":"function","line":112,"end":251,"sig":"func sandboxArgs(bw string, tool *Tool, inDir, outDir, toolDir string, toolEnv []string) ([]string, error) {","doc":"sandboxArgs builds the argv given an already-resolved bwrap path. It is split from bakeSandbox only so the hardening it applies can be asserted on a machine that doesn't have bubblewrap installed \u2014 otherwise the test that a flag like --new-session is still present skips exactly where it is most likely to be quietly dropped.","parent":null,"test":false,"nested":false,"module_use":true,"callers":9,"callees":2,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/executor.go#Desk.Execute@252","file":"deskbox/cmd/agent-desk/executor.go","name":"Execute","kind":"method","line":252,"end":545,"sig":"func (d *Desk) Execute(parent context.Context, tool *Tool, job *Job, input map[string]any) (any, error) {","doc":"Execute runs a tool's run script and enforces its contract:    - each job gets its own workspace under <dataDir>/jobs/<id>/ with in/ and     out/; the input document is materialized as in/input.json (or the exact     files declared in sandbox.in) \u2014 \"the directory necessary for the pull\"   - the tool runs inside the minimal bwrap sandbox from bakeSandbox   - output is read from the first declared s","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":9,"callees":15,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/executor.go#auditOutDir@546","file":"deskbox/cmd/agent-desk/executor.go","name":"auditOutDir","kind":"function","line":546,"end":574,"sig":"func auditOutDir(outDir string, declared []string) []string {","doc":"auditOutDir walks out/ and returns every file that is not declared in the contract's sandbox.out. Empty declared list means: no writes at all.  A symlink is always a violation, regardless of its name: out/ is bound read-write into the sandbox, so a symlink is how a tool would try to make the desk read (or later serve) an arbitrary host path once the sandbox that wrote it is gone.","parent":null,"test":false,"nested":false,"module_use":true,"callers":1,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/executor.go#pathTraverses@575","file":"deskbox/cmd/agent-desk/executor.go","name":"pathTraverses","kind":"function","line":575,"end":578,"sig":"func pathTraverses(p string) bool {","doc":"pathTraverses rejects absolute paths, \"..\", and empty values so a contract can't smuggle a path outside the job workspace.","parent":null,"test":false,"nested":false,"module_use":true,"callers":3,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/executor.go#hasBwrap@579","file":"deskbox/cmd/agent-desk/executor.go","name":"hasBwrap","kind":"function","line":579,"end":591,"sig":"func hasBwrap() bool {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":3,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/executor.go#canScopeJobs@592","file":"deskbox/cmd/agent-desk/executor.go","name":"canScopeJobs","kind":"function","line":592,"end":621,"sig":"func canScopeJobs() bool {","doc":"canScopeJobs checks, once at startup, whether `systemd-run --user --scope` actually works here \u2014 not just whether the binary exists. It needs a working user D-Bus session (XDG_RUNTIME_DIR + a running systemd --user instance), which a plain non-interactive process \u2014 the desk started over bare SSH, or as a systemd service without a linger'd/logind session \u2014 may not have even though the binary is on ","parent":null,"test":false,"nested":false,"module_use":true,"callers":3,"callees":1,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/executor.go#wrapWithResourceLimits@622","file":"deskbox/cmd/agent-desk/executor.go","name":"wrapWithResourceLimits","kind":"function","line":622,"end":641,"sig":"func wrapWithResourceLimits(args []string, s *Settings, available bool) []string {","doc":"wrapWithResourceLimits prefixes argv with systemd-run so the job's process tree runs in its own cgroup scope, capped independently of every other concurrent job. bwrap's namespaces isolate identity and filesystem visibility; they do not cap memory or process count, so without this a single runaway or malicious tool (leak, fork bomb, infinite loop) can degrade the host for every other job running a","parent":null,"test":false,"nested":false,"module_use":true,"callers":2,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/executor.go#truncate@642","file":"deskbox/cmd/agent-desk/executor.go","name":"truncate","kind":"function","line":642,"end":648,"sig":"func truncate(s string, n int) string {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":1,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/integrity.go#IntegritySpec@43","file":"deskbox/cmd/agent-desk/integrity.go","name":"IntegritySpec","kind":"type","line":43,"end":50,"sig":"type IntegritySpec struct {","doc":"IntegritySpec is the optional `integrity:` block in tcs.yaml.","parent":null,"test":false,"nested":false,"module_use":true,"callers":0,"callees":0,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/integrity.go#IntegritySpec.runPinned@51","file":"deskbox/cmd/agent-desk/integrity.go","name":"runPinned","kind":"method","line":51,"end":51,"sig":"func (i IntegritySpec) runPinned() bool    { return strings.TrimSpace(i.RunSHA256) != \"\" }","doc":"","parent":"IntegritySpec","test":false,"nested":false,"module_use":false,"callers":2,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/integrity.go#IntegritySpec.interpPinned@52","file":"deskbox/cmd/agent-desk/integrity.go","name":"interpPinned","kind":"method","line":52,"end":57,"sig":"func (i IntegritySpec) interpPinned() bool { return strings.TrimSpace(i.InterpreterSHA256) != \"\" }","doc":"","parent":"IntegritySpec","test":false,"nested":false,"module_use":false,"callers":1,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/integrity.go#resolveInterpreter@58","file":"deskbox/cmd/agent-desk/integrity.go","name":"resolveInterpreter","kind":"function","line":58,"end":65,"sig":"func resolveInterpreter(runPath string) (name, path string, ok bool) {","doc":"resolveInterpreter returns the interpreter a tool's run script will actually be executed by, resolved the same way a job will find it and the same way tcs-verify checks it: shared in internal/tcs so the daemon and the offline linter can't resolve it differently.","parent":null,"test":false,"nested":false,"module_use":true,"callers":2,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/integrity.go#verifyIntegrity@66","file":"deskbox/cmd/agent-desk/integrity.go","name":"verifyIntegrity","kind":"function","line":66,"end":105,"sig":"func verifyIntegrity(t *Tool) error {","doc":"verifyIntegrity checks a tool's run script, and the interpreter that runs it, against their pins. An unpinned tool passes: pinning is opt-in, and refusing to run everything that hasn't adopted it yet would just get the check turned off.","parent":null,"test":false,"nested":false,"module_use":true,"callers":3,"callees":4,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/integrity.go#FormatPins@106","file":"deskbox/cmd/agent-desk/integrity.go","name":"FormatPins","kind":"function","line":106,"end":136,"sig":"func FormatPins(tools map[string]*Tool) string {","doc":"FormatPins prints a paste-ready integrity block per tool, so adopting a pin costs one copy. Deliberately print-only: a flag that edited tcs.yaml would re-pin whatever h esToLoad","kind":"function","line":96,"end":114,"sig":"func TestChangedScriptRefusesToLoad(t *testing.T) {","doc":"TestChangedScriptRefusesToLoad covers the other layer: a tool the desk cannot stand behind should never appear in GET /tools at all.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":3,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/integrity_test.go#TestUnpinnedToolStillRuns@115","file":"deskbox/cmd/agent-desk/integrity_test.go","name":"TestUnpinnedToolStillRuns","kind":"function","line":115,"end":132,"sig":"func TestUnpinnedToolStillRuns(t *testing.T) {","doc":"TestUnpinnedToolStillRuns: pinning is opt-in. Refusing everything that has not adopted it would get the whole check switched off.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":5,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/integrity_test.go#TestFormatPinsNeverEditsAnything@133","file":"deskbox/cmd/agent-desk/integrity_test.go","name":"TestFormatPinsNeverEditsAnything","kind":"function","line":133,"end":153,"sig":"func TestFormatPinsNeverEditsAnything(t *testing.T) {","doc":"TestFormatPinsNeverEditsAnything: a -pin that rewrote tcs.yaml would re-pin whatever happens to be on disk, which is precisely what the pin exists to catch.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":3,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/interpreter_pin_test.go#interpPinnedTool@18","file":"deskbox/cmd/agent-desk/interpreter_pin_test.go","name":"interpPinnedTool","kind":"function","line":18,"end":41,"sig":"func interpPinnedTool(t *testing.T, interpHash string) (*Tool, string) {","doc":"interpPinnedTool writes a shell tool whose tcs.yaml pins interpreter_sha256 to the given value. The shebang is /bin/sh so the interpreter resolves to a real, stable file on any Linux \u2014 the test controls the hash by choosing to pin the true value or a wrong one, touching no system f nterpreter than the one on disk must not load \u2014 the same \"only advertise tools we can stand behind\" rule the run-script pin follows.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/interpreter_pin_test.go#TestInterpreterPinMismatchRefusedMidFlight@94","file":"deskbox/cmd/agent-desk/interpreter_pin_test.go","name":"TestInterpreterPinMismatchRefusedMidFlight","kind":"function","line":94,"end":112,"sig":"func TestInterpreterPinMismatchRefusedMidFlight(t *testing.T) {","doc":"TestInterpreterPinMismatchRefusedMidFlight: the load-time check has a hole a long-running desk must also close per job \u2014 verifyIntegrity is what Execute calls, so exercise it directly with a mismatch and confirm the actionable refusal.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":4,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/jobtoken.go#jobTokenMessage@27","file":"deskbox/cmd/agent-desk/jobtoken.go","name":"jobTokenMessage","kind":"function","line":27,"end":30,"sig":"func jobTokenMessage(tool, jobID string, attempt int, ts int64) string {","doc":"jobTokenMessage is the exact byte string that is MACed. The receiver (harness/broker/sbx_broker.py) builds the same string; keep them identical.","parent":null,"test":false,"nested":false,"module_use":true,"callers":2,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/jobtoken.go#jobTokenMAC@31","file":"deskbox/cmd/agent-desk/jobtoken.go","name":"jobTokenMAC","kind":"function","line":31,"end":39,"sig":"func jobTokenMAC(key []byte, tool, jobID string, attempt int, ts int64) string {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":3,"callees":2,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/jobtoken.go#readJobKey@40","file":"deskbox/cmd/agent-desk/jobtoken.go","name":"readJobKey","kind":"function","line":40,"end":56,"sig":"func readJobKey(path string) ([]byte, error) {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":1,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/jobtoken.go#jobTokenEnv@57","file":"deskbox/cmd/agent-desk/jobtoken.go","name":"jobTokenEnv","kind":"function","line":57,"end":68,"sig":"func jobTokenEnv(keyPath, tool, jobID string, attempt int, now time.Time) ([]string, error) {","doc":"jobTokenEnv returns the two variables a job needs to present its token, in addition to the DESKBOX_TOOL, DESKBOX_JOB_ID and DESKBOX_ATTEMPT it already gets. The key is read per job: the receiver may regenerate it when it restarts, and a desk that cached the old one would fail every job until it was restarted too.","parent":null,"test":false,"nested":false,"module_use":true,"callers":2,"callees":2,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/jobtoken_test.go#TestJobTokenMACIsBoundToEveryField@11","file":"deskbox/cmd/agent-desk/jobtoken_test.go","name":"TestJobTokenMACIsBoundToEveryField","kind":"function","line":11,"end":31,"sig":"func TestJobTokenMACIsBoundToEveryField(t *testing.T) {","doc":"","parent":null,"test":true,"nested":false,"module_use":false,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/jobtoken_test.go#TestJobTokenKnownVector@32","file":"deskbox/cmd/agent-desk/jobtoken_test.go","name":"TestJobTokenKnownVector","kind":"function","line":32,"end":44,"sig":"func TestJobTokenKnownVector(t *testing.T) {","doc":"The receiver (Python) must build the same string. This pins the format and one vector so a change on either side fails a test on that side.","parent":null,"test":true,"nested":false,"module_use":false,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/jobtoken_test.go#TestJobTokenEnvReadsTheKeyPerJobAndRefusesABadOne@45","file":"deskbox/cmd/agent-desk/jobtoken_test.go","name":"TestJobTokenEnvReadsTheKeyPerJobAndRefusesABadOne","kind":"function","line":45,"end":73,"sig":"func TestJobTokenEnvReadsTheKeyPerJobAndRefusesABadOne(t *testing.T) {","doc":"","parent":null,"test":true,"nested":false,"module_use":false,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/limits_test.go#TestJobIDsAreWideEnough@17","file":"deskbox/cmd/agent-desk/limits_test.go","name":"TestJobIDsAreWideEnough","kind":"function","line":17,"end":43,"sig":"func TestJobIDsAreWideEnough(t *testing.T) {","doc":"TestJobIDsAreWideEnough guards the birthday bound. The old ids were 4 bytes: ~1% chance of a collision after 10,000 jobs, ~39% after 65,536. A collision is not cosmetic \u2014 the id is the store's primary key, the workspace path under data/jobs/<id>/, and the path segment in GET /jobs/{id}/out/{file}, so two jobs sharing one read and overwrite each other's output.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/limits_test.go#TestSubmitRejectsOversizeBody@44","file":"deskbox/cmd/agent-desk/limits_test.go","name":"TestSubmitRejectsOversizeBody","kind":"function","line":44,"end":64,"sig":"func TestSubmitRejectsOversizeBody(t *testing.T) {","doc":"TestSubmitRejectsOversizeBody covers the unbounded-decode hole: the body was read into memory whatever its size, then copied again into the job workspace and again into the store \u2014 an unbounded multiple of itself in RSS, on a daemon that otherwise caps what a tool can hand back.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":4,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/limits_test.go#TestSubmitRejectsTrailingContent@65","file":"deskbox/cmd/agent-desk/limits_test.go","name":"TestSubmitRejectsTrailingContent","kind":"function","line":65,"end":82,"sig":"func TestSubmitRejectsTrailingContent(t *testing.T) {","doc":"TestSubmitRejectsTrailingContent: taking the first document and silently discarding the rest is how a client/desk disagreement turns into a bug long after the request that caused it.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":4,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/limits_test.go#TestBatchRejectsTooManyItems@83","file":"deskbox/cmd/agent-desk/limits_test.go","name":"TestBatchRejectsTooManyItems","kind":"function","line":83,"end":105,"sig":"func TestBatchRejectsTooManyItems(t *testing.T) {","doc":"TestBatchRejectsTooManyItems: every item becomes its own job, row and workspace, so an accidental extra zero should get a clear refusal rather than being absorbed.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":4,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#plural@29","file":"deskbox/cmd/agent-desk/main.go","name":"plural","kind":"function","line":29,"end":35,"sig":"func plural(n int, one, many string) string {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":1,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#versionString@36","file":"deskbox/cmd/agent-desk/main.go","name":"versionString","kind":"function","line":36,"end":52,"sig":"func versionString() string {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":1,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk@53","file":"deskbox/cmd/agent-desk/main.go","name":"Desk","kind":"type","line":53,"end":77,"sig":"type Desk struct {","doc":"Desk is the enforcing proxy. Every tool invocation an agent makes must pass through here, so the contract (TCS) is load-bearing: inputs are validated on the way in, side effects and output schema on the way out.","parent":null,"test":false,"nested":false,"module_use":true,"callers":0,"callees":0,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#NewDesk@78","file":"deskbox/cmd/agent-desk/main.go","name":"NewDesk","kind":"function","line":78,"end":91,"sig":"func NewDesk(tools map[string]*Tool, q *Queue, dataDir string, settings *Settings, sandboxOK, resourceLimitsOK bool) *Desk {","doc":"NewDesk wires up a Desk from its already-loaded dependencies. sandboxOK and resourceLimitsOK are passed in rather than probed here because they're startup-time facts the caller already determined once, not per-request work.","parent":null,"test":false,"nested":false,"module_use":true,"callers":12,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.enforcement@92","file":"deskbox/cmd/agent-desk/main.go","name":"enforcement","kind":"method","line":92,"end":156,"sig":"func (d *Desk) enforcement() map[string]any {","doc":"enforcement reports whether each guarantee the desk advertises is actually in force right now, so an operator can check without reading the startup log \u2014 and so a monitoring probe can watch one boolean.  \"degraded\" covers only mechanisms the desk tried to use and couldn't: the sandbox and the per-job caps. Auth being off is a deployment choice rather than a failure, so it lands in warnings without","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":4,"callees":4,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#main@157","file":"deskbox/cmd/agent-desk/main.go","name":"main","kind":"function","line":157,"end":469,"sig":"func main() {","doc":"","parent":null,"test":false,"nested":false,"module_use":true,"callers":1,"callees":32,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#requireAuth@470","file":"deskbox/cmd/agent-desk/main.go","name":"requireAuth","kind":"function","line":470,"end":481,"sig":"func requireAuth(token string, next http.Handler) http.Handler {","doc":"requireAuth rejects any request without a matching Authorization: Bearer <token> header. Comparison is constant-time so response timing can't leak how much of the token a guess got right.","parent":null,"test":false,"nested":false,"module_use":true,"callers":1,"callees":4,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleStatus@482","file":"deskbox/cmd/agent-desk/main.go","name":"handleStatus","kind":"method","line":482,"end":490,"sig":"func (d *Desk) handleStatus(w http.ResponseWriter, r *http.Request) {","doc":"","parent":"Desk","test":false,"nested":false,"module_use":false,"callers":0,"callees":3,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleListTools@491","file":"deskbox/cmd/agent-desk/main.go","name":"handleListTools","kind":"method","line":491,"end":516,"sig":"func (d *Desk) handleListTools(w http.ResponseWriter, r *http.Request) {","doc":"","parent":"Desk","test":false,"nested":false,"module_use":false,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleGetTool@517","file":"deskbox/cmd/agent-desk/main.go","name":"handleGetTool","kind":"method","line":517,"end":530,"sig":"func (d *Desk) handleGetTool(w http.ResponseWriter, r *http.Request) {","doc":"handleGetTool returns the TCS contract an agent must conform to before it is allowed to invoke this tool. tcs.yaml is the authoring format on disk; every response this API sends is JSON with no exceptions, so it's re-decoded generically (not through the Tool struct, so no field the struct doesn't model is silently dropped) rather than served as raw YAML.","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#submitRequest@531","file":"deskbox/cmd/agent-desk/main.go","name":"submitRequest","kind":"type","line":531,"end":546,"sig":"type submitRequest struct {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":0,"callees":0,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#parseWait@547","file":"deskbox/cmd/agent-desk/main.go","name":"parseWait","kind":"function","line":547,"end":587,"sig":"func parseWait(r *http.Request) (time.Duration, error) {","doc":"parseWait reads ?wait=<duration> (e.g. \"5s\", \"500ms\") for the unified invoke path. Missing or empty is 0 \u2014 the original async-first behavior for a queued tool: 202 + Location, no blocking. A positive value blocks up to that long for the job to finish before falling back to 202, clamped to maxWait so a caller can't hold the connection open forever by accident. A \"direct\" tool ignores this entirely ","parent":null,"test":false,"nested":false,"module_use":true,"callers":1,"callees":3,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleSubmit@588","file":"deskbox/cmd/agent-desk/main.go","name":"handleSubmit","kind":"method","line":588,"end":664,"sig":"func (d *Desk) handleSubmit(w http.ResponseWriter, r *http.Request) {","doc":"","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":2,"callees":9,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleWaitJob@665","file":"deskbox/cmd/agent-desk/main.go","name":"handleWaitJob","kind":"method","line":665,"end":703,"sig":"func (d *Desk) handleWaitJob(w http.ResponseWriter, r *http.Request) {","doc":"handleWaitJob long-polls: blocks until the job reaches a terminal state or ?timeout elapses (default 25s, capped at maxWait), instead of the caller hammering GET /jobs/{id} in a tight loop.","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":0,"callees":6,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleCancelJob@704","file":"deskbox/cmd/agent-desk/main.go","name":"handleCancelJob","kind":"method","line":704,"end":730,"sig":"func (d *Desk) handleCancelJob(w http.ResponseWriter, r *http.Request) {","doc":"handleCancelJob cancels a queued or running job. A queued job is skipped the moment its worker turn comes; a running job's process is killed via its context (see Queue.Cancel / Queue.process). A job that already reached a terminal state is a 409, not an error \u2014 cancellation is a no-op there, not a failure.","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleListInbox@731","file":"deskbox/cmd/agent-desk/main.go","name":"handleListInbox","kind":"method","line":731,"end":752,"sig":"func (d *Desk) handleListInbox(w http.ResponseWriter, r *http.Request) {","doc":"handleListInbox is the inbox: every terminal job the operator hasn't acked yet, most-recently-finished first. This is the desk's replacement for a claim/TTL delivery mechanism \u2014 with one always-on desk process instead of many independent ones, there's no \"who's currently watching\" race to arbitrate: multiple readers seeing the same unacked job is harmless, so this is a plain query, not a claim. No","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":0,"callees":7,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleWaitAnyJob@753","file":"deskbox/cmd/agent-desk/main.go","name":"handleWaitAnyJob","kind":"method","line":753,"end":784,"sig":"func (d *Desk) handleWaitAnyJob(w http.ResponseWriter, r *http.Request) {","doc":"handleWaitAnyJob long-polls the inbox: blocks until at least one job is terminal-and-unacked, or ?timeout elapses (default 25s, capped at maxWait) \u2014 instead of polling GET /jobs yourself in a loop. The zero-latency half of the inbox model.","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":0,"callees":5,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleAckJob@785","file":"deskbox/cmd/agent-desk/main.go","name":"handleAckJob","kind":"method","line":785,"end":798,"sig":"func (d *Desk) handleAckJob(w http.ResponseWriter, r *http.Request) {","doc":"handleAckJob marks a terminal job's result seen/handled \u2014 the other half of the inbox model (handleListInbox is the inbox; this empties it one item at a time). Acking a non-terminal job is a 409: there's nothing to ack yet. Acking an already-acked job is idempotent, not an error.","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":0,"callees":5,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#batchRequest@799","file":"deskbox/cmd/agent-desk/main.go","name":"batchRequest","kind":"type","line":799,"end":811,"sig":"type batchRequest struct {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":0,"callees":1,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleCreateBatch@812","file":"deskbox/cmd/agent-desk/main.go","name":"handleCreateBatch","kind":"method","line":812,"end":899,"sig":"func (d *Desk) handleCreateBatch(w http.ResponseWriter, r *http.Request) {","doc":"handleCreateBatch is the first-class replacement for lease-based chunk claiming: one job per item, fanned out under a shared batch id, each going through the exact same queue/store/retry path as any other job. A dead item is just a failed job on the existing retry path; a desk restart mid-batch resumes via Resume/LoadIncomplete same as any other in-flight job \u2014 there is one worker (the desk itself","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":1,"callees":4,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleGetBatch@900","file":"deskbox/cmd/agent-desk/main.go","name":"handleGetBatch","kind":"method","line":900,"end":926,"sig":"func (d *Desk) handleGetBatch(w http.ResponseWriter, r *http.Request) {","doc":"handleGetBatch reports batch progress: items done/total, broken down by status. This is the \"content-progress heartbeat\" flagged as unbuilt in the old system's own design notes \u2014 here for free, as a side effect of a batch item just being an ordinary job the desk already tracks.","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":0,"callees":4,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleGetJob@927","file":"deskbox/cmd/agent-desk/main.go","name":"handleGetJob","kind":"method","line":927,"end":947,"sig":"func (d *Desk) handleGetJob(w http.ResponseWriter, r *http.Request) {","doc":"","parent":"Desk","test":false,"nested":false,"module_use":false,"callers":0,"callees":4,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleGetOutFile@948","file":"deskbox/cmd/agent-desk/main.go","name":"handleGetOutFile","kind":"method","line":948,"end":986,"sig":"func (d *Desk) handleGetOutFile(w http.ResponseWriter, r *http.Request) {","doc":"handleGetOutFile streams a file from the job's out/ dir \u2014 the \"simply tail\" surface. Works while the job is still running, and stays available after.  Only names the tool's own contract declares in sandbox.out are servable, and only if the path is a regular file: the desk bind-mounts out/ read-write into the sandbox, so a tool could otherwise write a symlink (e.g. to /etc/passwd or the host's .env","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":0,"callees":6,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#declaresOut@987","file":"deskbox/cmd/agent-desk/main.go","name":"declaresOut","kind":"function","line":987,"end":995,"sig":"func declaresOut(tool *Tool, rel string) bool {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":1,"callees":0,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handleQueueStats@996","file":"deskbox/cmd/agent-desk/main.go","name":"handleQueueStats","kind":"method","line":996,"end":999,"sig":"func (d *Desk) handleQueueStats(w http.ResponseWriter, r *http.Request) {","doc":"","parent":"Desk","test":false,"nested":false,"module_use":false,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#defaultDataDir@1000","file":"deskbox/cmd/agent-desk/main.go","name":"defaultDataDir","kind":"function","line":1000,"end":1010,"sig":"func defaultDataDir() string {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":1,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#Desk.handlePreflight@1011","file":"deskbox/cmd/agent-desk/main.go","name":"handlePreflight","kind":"method","line":1011,"end":1036,"sig":"func (d *Desk) handlePreflight(w http.ResponseWriter, r *http.Request) {","doc":"handlePreflight reports the same dependency resolution -check prints, as JSON, so an operator (or an agent that just got a confusing tool failure) can ask a running desk what it is missing without shell access to the box.","parent":"Desk","test":false,"nested":false,"module_use":true,"callers":0,"callees":3,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#decodeBody@1037","file":"deskbox/cmd/agent-desk/main.go","name":"decodeBody","kind":"function","line":1037,"end":1055,"sig":"func decodeBody(w http.ResponseWriter, r *http.Request, v any) error {","doc":"decodeBody reads a request body with a hard size ceiling. MaxBytesReader (rather than checking Content-Length) is what makes the limit real: a chunked request declares no length, and a lying one declares whatever it likes.","parent":null,"test":false,"nested":false,"module_use":true,"callers":2,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#writeJSON@1056","file":"deskbox/cmd/agent-desk/main.go","name":"writeJSON","kind":"function","line":1056,"end":1061,"sig":"func writeJSON(w http.ResponseWriter, code int, v any) {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":16,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/main.go#orDefault@1062","file":"deskbox/cmd/agent-desk/main.go","name":"orDefault","kind":"function","line":1062,"end":1068,"sig":"func orDefault(s, def string) string {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":2,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/posture.go#runningAsRoot@30","file":"deskbox/cmd/agent-desk/posture.go","name":"runningAsRoot","kind":"function","line":30,"end":33,"sig":"func runningAsRoot() bool { return os.Getuid() == 0 || os.Geteuid() == 0 }","doc":"runningAsRoot reports whether tools will run with uid 0.  Nothing in the executor sets a credential, so a tool runs as exactly the user the desk runs as \u2014 that is what makes \"tools can't touch anything this user can't\" true, and it is also why running the desk as root throws that away. The sandbox still limits which paths exist inside it, but everything reachable there (the job's out/ dir, /dev, w","parent":null,"test":false,"nested":false,"module_use":true,"callers":5,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/posture.go#describeUser@34","file":"deskbox/cmd/agent-desk/posture.go","name":"describeUser","kind":"function","line":34,"end":50,"sig":"func describeUser() string {","doc":"describeUser names the account tools will run as, for the startup log and the enforcement block. A desk is only as contained as this account is.","parent":null,"test":false,"nested":false,"module_use":true,"callers":3,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/posture.go#isUnixSocket@51","file":"deskbox/cmd/agent-desk/posture.go","name":"isUnixSocket","kind":"function","line":51,"end":58,"sig":"func isUnixSocket(addr string) bool { return strings.Contains(addr, \"/\") }","doc":"isUnixSocket reports whether addr names a filesystem path rather than a host:port. Anything containing a separator is a path \u2014 a TCP address never is.","parent":null,"test":false,"nested":false,"module_use":true,"callers":5,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/posture.go#listen@59","file":"deskbox/cmd/agent-desk/posture.go","name":"listen","kind":"function","line":59,"end":97,"sig":"func listen(addr string) (net.Listener, error) {","doc":"listen opens the desk's socket. A unix socket is created 0600, which is the only binding that is actually scoped to one OS user: loopback stops the network, but every local account can still reach 127.0.0.1, and a job submitted by any of them runs as the user the desk runs as. With a socket, the kernel checks the file mode on connect and there is nothing to authenticate against.","parent":null,"test":false,"nested":false,"module_use":true,"callers":3,"callees":3,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/posture.go#listensBeyondLoopback@98","file":"deskbox/cmd/agent-desk/posture.go","name":"listensBeyondLoopback","kind":"function","line":98,"end":125,"sig":"func listensBeyondLoopback(addr string) bool {","doc":"listensBeyondLoopback reports whether addr is reachable from another machine. An empty host (\":8080\") means every interface, which is the case worth catching: combined with auth off \u2014 the default \u2014 it means anyone who can route to the box can submit jobs to a daemon whose entire purpose is running programs.","parent":null,"test":false,"nested":false,"module_use":true,"callers":4,"callees":1,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/posture_test.go#TestListensBeyondLoopback@15","file":"deskbox/cmd/agent-desk/posture_test.go","name":"TestListensBeyondLoopback","kind":"function","line":15,"end":44,"sig":"func TestListensBeyondLoopback(t *testing.T) {","doc":"TestListensBeyondLoopback pins the judgement that decides whether the desk warns (and whether -strict refuses). Getting \":8080\" wrong is the expensive case: it reads like \"nothing specified\" and means \"every interface\", which with auth off is an open remote-execution port.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":1,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/posture_test.go#TestRootDetectionMatchesProcess@45","file":"deskbox/cmd/agent-desk/posture_test.go","name":"TestRootDetectionMatchesProcess","kind":"function","line":45,"end":58,"sig":"func TestRootDetectionMatchesProcess(t *testing.T) {","doc":"TestRootDetectionMatchesProcess is deliberately not a mock: the whole value of the check is that it reports the real process, and a test that stubbed the uid would assert nothing about that.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/posture_test.go#TestEnforcementReportsPosture@59","file":"deskbox/cmd/agent-desk/posture_test.go","name":"TestEnforcementReportsPosture","kind":"function","line":59,"end":86,"sig":"func TestEnforcementReportsPosture(t *testing.T) {","doc":"TestEnforcementReportsPosture checks that the account tools run as shows up in the block an operator (or an agent) reads to decide how much to trust a result \u2014 and that root counts as degraded, since a sandbox whose contents are all reached as uid 0 is worth much less than it looks.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":4,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/posture_test.go#TestSandboxArgsHardening@87","file":"deskbox/cmd/agent-desk/posture_test.go","name":"TestSandboxArgsHardening","kind":"function","line":87,"end":111,"sig":"func TestSandboxArgsHardening(t *testing.T) {","doc":"TestSandboxArgsHardening guards the flags whose absence is a security hole rather than a missing feature, so a future edit to bakeSandbox has to break a test to remove one.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/posture_test.go#TestUnixSocketIsUserScoped@112","file":"deskbox/cmd/agent-desk/posture_test.go","name":"TestUnixSocketIsUserScoped","kind":"function","line":112,"end":143,"sig":"func TestUnixSocketIsUserScoped(t *testing.T) {","doc":"TestUnixSocketIsUserScoped covers the binding that actually implements \"scoped to the OS user running the desk\". Loopback stops the network but not other local accounts; a 0600 socket is checked by the kernel on connect, with no shared secret involved.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":6,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/posture_test.go#TestListenReclaimsStaleSocketButNotFiles@144","file":"deskbox/cmd/agent-desk/posture_test.go","name":"TestListenReclaimsStaleSocketButNotFiles","kind":"function","line":144,"end":181,"sig":"func TestListenReclaimsStaleSocketButNotFiles(t *testing.T) {","doc":"TestListenReclaimsStaleSocketButNotFiles: a desk killed hard leaves its socket behind and would otherwise never bind again \u2014 but a mistyped path must never cost someone a file.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":4,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/posture_test.go#TestAuthWarningMatchesTheBinding@182","file":"deskbox/cmd/agent-desk/posture_test.go","name":"TestAuthWarningMatchesTheBinding","kind":"function","line":182,"end":212,"sig":"func TestAuthWarningMatchesTheBinding(t *testing.T) {","doc":"TestAuthWarningMatchesTheBinding guards against the posture report crying wolf: a list an operator learns to ignore is worse than no list.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":3,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/preflight.go#Dependency@43","file":"deskbox/cmd/agent-desk/preflight.go","name":"Dependency","kind":"type","line":43,"end":57,"sig":"type Dependency struct {","doc":"Dependency is one thing a tool needs, and whether this box has it.","parent":null,"test":false,"nested":false,"module_use":true,"callers":0,"callees":0,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/preflight.go#Dependency.Fatal@58","file":"deskbox/cmd/agent-desk/preflight.go","name":"Fatal","kind":"method","line":58,"end":68,"sig":"func (d Dependency) Fatal(sandboxed bool) bool {","doc":"Fatal reports whether this finding means the tool cannot run as configured. A dependency outside the sandbox roots only breaks things once bubblewrap is actually in use \u2014 on a host without it the tool runs unsandboxed and the path resolves fine \u2014 so the same finding is an error there and a portability warning here, and saying so beats picking one and being wrong half the time.","parent":"Dependency","test":false,"nested":false,"module_use":true,"callers":38,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/preflight.go#Preflight@69","file":"deskbox/cmd/agent-desk/preflight.go","name":"Preflight","kind":"function","line":69,"end":78,"sig":"func Preflight(tools map[string]*Tool) []Dependency {","doc":"Preflight resolves every declared dependency of every loaded tool.","parent":null,"test":false,"nested":false,"module_use":true,"callers":3,"callees":2,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/preflight.go#sortedToolNames@79","file":"deskbox/cmd/agent-desk/preflight.go","name":"sortedToolNames","kind":"function","line":79,"end":87,"sig":"func sortedToolNames(tools map[string]*Tool) []string {","doc":"sortedToolNames keeps every report \u2014 preflight, pins \u2014 in a stable order so the same box prints the same thing twice.","parent":null,"test":false,"nested":false,"module_use":true,"callers":2,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/preflight.go#toolDependencies@88","file":"deskbox/cmd/agent-desk/preflight.go","name":"toolDependencies","kind":"function","line":88,"end":119,"sig":"func toolDependencies(t *Tool) []Dependency {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":1,"callees":2,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/preflight.go#resolveDep@120","file":"deskbox/cmd/agent-desk/preflight.go","name":"resolveDep","kind":"function","line":120,"end":143,"sig":"func resolveDep(tool, kind, name string) Dependency {","doc tring) string {","doc":"","parent":null,"test":false,"nested":false,"module_use":false,"callers":1,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/preflight.go#PreflightProblems@233","file":"deskbox/cmd/agent-desk/preflight.go","name":"PreflightProblems","kind":"function","line":233,"end":242,"sig":"func PreflightProblems(deps []Dependency) []Dependency {","doc":"PreflightProblems returns every finding that isn't a clean resolve.","parent":null,"test":false,"nested":false,"module_use":true,"callers":1,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/preflight_test.go#TestInsideSandboxRoots@12","file":"deskbox/cmd/agent-desk/preflight_test.go","name":"TestInsideSandboxRoots","kind":"function","line":12,"end":31,"sig":"func TestInsideSandboxRoots(t *testing.T) {","doc":"TestInsideSandboxRoots guards the prefix trap: a plain strings.HasPrefix against \"/usr\" would accept \"/usrlocal/bin/python3\" and \"/libre/x\", reporting a path the sandbox cannot see as fine.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":1,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/preflight_test.go#TestOutsideSandboxSeverityDependsOnSandbox@32","file":"deskbox/cmd/agent-desk/preflight_test.go","name":"TestOutsideSandboxSeverityDependsOnSandbox","kind":"function","line":32,"end":52,"sig":"func TestOutsideSandboxSeverityDependsOnSandbox(t *testing.T) {","doc":"TestOutsideSandboxSeverityDependsOnSandbox pins the judgement call: the same finding is fatal on a host with bubblewrap (the tool genuinely cannot see its runtime) and a portability warning on one without (the tool runs unsandboxed and the path resolves fine).","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":1,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/preflight_test.go#TestShimCommand@53","file":"deskbox/cmd/agent-desk/preflight_test.go","name":"TestShimCommand","kind":"function","line":53,"end":83,"sig":"func TestShimCommand(t *testing.T) {","doc":"","parent":null,"test":true,"nested":false,"module_use":false,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/preflight_test.go#TestPreflightFindsToolDependencies@84","file":"deskbox/cmd/agent-desk/preflight_test.go","name":"TestPreflightFindsToolDependencies","kind":"function","line":84,"end":155,"sig":"func TestPreflightFindsToolDependencies(t *testing.T) {","doc":"TestPreflightFindsToolDependencies drives the whole thing against tools on disk, the way -check does.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":4,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/preflight_test.go#TestLoadToolsMissingDirIsNotFatal@156","file":"deskbox/cmd/agent-desk/preflight_test.go","name":"TestLoadToolsMissingDirIsNotFatal","kind":"function","line":156,"end":173,"sig":"func TestLoadToolsMissingDirIsNotFatal(t *testing.T) {","doc":"TestLoadToolsMissingDirIsNotFatal covers the first thing someone does with a release: unpack the tarball and run the binary. There is no tools/ directory yet, and exiting before printing anything useful is a bad first thirty seconds. An unreadable directory is still an error \u2014 that one is a misconfiguration, not an empty starting point.","parent":null,"test":true,"nested":false,"module_use":true,"callers":0,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#JobStatus.isTerminal@28","file":"deskbox/cmd/agent-desk/queue.go","name":"isTerminal","kind":"method","line":28,"end":34,"sig":"func (s JobStatus) isTerminal() bool {","doc":"isTerminal reports whether a job has reached a state that will never change again \u2014 nothing further will run for it, and no future write (retry, cancel) can move it out of this status.","parent":"JobStatus","test":false,"nested":false,"module_use":true,"callers":6,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Job@35","file":"deskbox/cmd/agent-desk/queue.go","name":"Job","kind":"type","line":35,"end":75,"sig":"type Job struct {","doc":"Job is one tool invocation flowing through the desk. Job IDs are what the agent polls; the desk keeps the history in memory so the contract story is auditable (\"what did the agent try, and why did it not conform?\").","parent":null,"test":false,"nested":false,"module_use":true,"callers":0,"callees":0,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue@76","file":"deskbox/cmd/agent-desk/queue.go","name":"Queue","kind":"type","line":76,"end":111,"sig":"type Queue struct {","doc":"","parent":null,"test":false,"nested":false,"module_use":true,"callers":0,"callees":4,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#NewQueue@112","file":"deskbox/cmd/agent-desk/queue.go","name":"NewQueue","kind":"function","line":112,"end":135,"sig":"func NewQueue(workers int, store JobStore) *Queue {","doc":"NewQueue builds an unstarted Queue backed by store. workers is clamped to at least 1 so a misconfigured desk still makes progress instead of stalling.","parent":null,"test":false,"nested":false,"module_use":true,"callers":17,"callees":1,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.reserve@136","file":"deskbox/cmd/agent-desk/queue.go","name":"reserve","kind":"method","line":136,"end":152,"sig":"func (q *Queue) reserve() error {","doc":"reserve claims a backlog slot for a new submission *before* the job is written to the store. Admission has to be decided first: refusing after the row exists leaves a job nobody is running but everybody can see \u2014 Resume() picks it up on the next restart despite the caller being told it was refused, and a retry with the same idempotency_key dedupes against that orphan and gets back a job that will ","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":6,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.release@153","file":"deskbox/cmd/agent-desk/queue.go","name":"release","kind":"method","line":153,"end":162,"sig":"func (q *Queue) release() {","doc":"release gives back a reservation whose job never made it \u2014 the store write failed, or an idempotency key deduped it onto an existing job.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":2,"callees":1,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.enqueueReserved@163","file":"deskbox/cmd/agent-desk/queue.go","name":"enqueueReserved","kind":"method","line":163,"end":175,"sig":"func (q *Queue) enqueueReserved(job *Job) {","doc":"enqueueReserved consumes a reservation taken by reserve(). It cannot fail: capacity was already accounted for.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":3,"callees":1,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.requeue@176","file":"deskbox/cmd/agent-desk/queue.go","name":"requeue","kind":"method","line":176,"end":188,"sig":"func (q *Queue) requeue(job *Job) error {","doc":"requeue puts already-accepted work back on the backlog \u2014 a retry, or a job reloaded after a restart. Never blocks and never refuses on capacity: the desk already told someone this job exists.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":4,"callees":1,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.signalWake@189","file":"deskbox/cmd/agent-desk/queue.go","name":"signalWake","kind":"method","line":189,"end":198,"sig":"func (q *Queue) signalWake() {","doc":"","parent":"Queue","test":false,"nested":false,"module_use":false,"callers":2,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.dispatch@199","file":"deskbox/cmd/agent-desk/queue.go","name":"dispatch","kind":"method","line":199,"end":236,"sig":"func (q *Queue) dispatch() {","doc":"dispatch is the only sender on ch. It moves jobs from the pending backlog into the channel one at a time, blocking only where blocking is safe: waiting for a worker to be free, with q.stop as an escape.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":2,"callees":1,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.Resume@237","file":"deskbox/cmd/agent-desk/queue.go","name":"Resume","kind":"method","line":237,"end":257,"sig":"func (q *Queue) Resume() (int, error) {","doc":"Resume reloads jobs left \"queued\" or \"running\" by a prior process lifetime and re-enqueues them, so a desk restart resumes work instead of silently dropping it. No-op when no store is configured.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":5,"callees":3,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.Start@258","file":"deskbox/cmd/agent-desk/queue.go","name":"Start","kind":"method","line":258,"end":267,"sig":"func (q *Queue) Start() {","doc":"Start launches the dispatcher and worker goroutines. Call once; Stop reverses it.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":1,"callees":2,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.Stop@268","file":"deskbox/cmd/agent-desk/queue.go","name":"Stop","kind":"method","line":268,"end":274,"sig":"func (q *Queue) Stop() {","doc":"Stop closes the stop channel and blocks until every worker has exited.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":1,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.Submit@275","file":"deskbox/cmd/agent-desk/queue.go","name":"Submit","kind":"method","line":275,"end":285,"sig":"func (q *Queue) Submit(tool *Tool, input, meta map[string]any, idempotencyKey string) (*Job, error) {","doc":"Submit enqueues a single job. It's a thin wrapper over submit with no batch id, kept separate from SubmitBatch so a lone job never carries batch semantics.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":2,"callees":2,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.SubmitBatch@286","file":"deskbox/cmd/agent-desk/queue.go","name":"SubmitBatch","kind":"method","line":286,"end":298,"sig":"func (q *Queue) SubmitBatch(tool *Tool, items []map[string]any, meta map[string]any) (string, []*Job, error) {","doc":"SubmitBatch fans out one job per item under a shared batch id \u2014 the first-class replacement for lease-based chunk claiming. There is one worker (the desk itself), and jobs already resume via Resume/ LoadIncomplete after a crash, so \"what happens if the worker dies mid-batch\" is exactly the existing per-job lifecycle: nothing new to invent for a lease to expire out of. No idempotency dedup per item","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":1,"callees":2,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.submit@299","file":"deskbox/cmd/agent-desk/queue.go","name":"submit","kind":"method","line":299,"end":350,"sig":"func (q *Queue) submit(tool *Tool, input, meta map[string]any, idempotencyKey, batchID string) (*Job, error) {","doc":"","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":2,"callees":8,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.snapshot@351","file":"deskbox/cmd/agent-desk/queue.go","name":"snapshot","kind":"method","line":351,"end":361,"sig":"func (q *Queue) snapshot(job *Job) *Job {","doc":"snapshot copies a Job's current field values under the queue's lock. A worker mutates a Job's fields in place via its own pointer in q.jobs; any caller serializing that job for an HTTP response must not read it without the same lock, or it races the worker. Copying returns a safe, private view instead.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":2,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.Get@362","file":"deskbox/cmd/agent-desk/queue.go","name":"Get","kind":"method","line":362,"end":385,"sig":"func (q *Queue) Get(id string) (*Job, bool, error) {","doc":"Get looks up a job. The error return is non-nil only for an actual store failure (e.g. the store unreachable) \u2014 callers must not fold that into \"not found\": an agent polling a real job during a DB blip needs to see that the lookup failed, not that its job vanished.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":11,"callees":3,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.worker@386","file":"deskbox/cmd/agent-desk/queue.go","name":"worker","kind":"method","line":386,"end":397,"sig":"func (q *Queue) worker() {","doc":"","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":3,"callees":1,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.process@398","file":"deskbox/cmd/agent-desk/queue.go","name":"process","kind":"method","line":398,"end":500,"sig":"func (q *Queue) process(job *Job) {","doc":"","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":5,"callees":6,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.finish@501","file":"deskbox/cmd/agent-desk/queue.go","name":"finish","kind":"method","line":501,"end":529,"sig":"func (q *Queue) finish(job *Job, result any, err error) {","doc":"","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":2,"callees":6,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.finishCanceled@530","file":"deskbox/cmd/agent-desk/queue.go","name":"finishCanceled","kind":"method","line":530,"end":546,"sig":"func (q *Queue) finishCanceled(job *Job) {","doc":"finishCanceled records a job an explicit Cancel() call already marked Canceled. It mirrors finish but never lets a done/failed result overwrite the Canceled status \u2014 whatever the tool's process actually returned (if it got a chance to return anything at all) is discarded.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":1,"callees":1,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.Cancel@547","file":"deskbox/cmd/agent-desk/queue.go","name":"Cancel","kind":"method","line":547,"end":602,"sig":"func (q *Queue) Cancel(id string) (*Job, bool, error) {","doc":"Cancel marks a queued or running job Canceled. A queued job (still sitting in ch, not yet picked up by a worker) is skipped the moment its worker turn comes; a running job's process is killed via the context Execute is running under. Returns (job, false, nil) if the job exists but already reached a terminal state \u2014 nothing to cancel, not an error. A job unknown to this process entirely (not tracke","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":6,"callees":6,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.WaitForTerminal@603","file":"deskbox/cmd/agent-desk/queue.go","name":"WaitForTerminal","kind":"method","line":603,"end":640,"sig":"func (q *Queue) WaitForTerminal(ctx context.Context, id string, deadline time.Time) (*Job, error) {","doc":"WaitForTerminal blocks until the job reaches a terminal state, the deadline passes, or ctx is done (e.g. the caller's HTTP connection dropped) \u2014 whichever comes first. Returns (nil, nil) if the job doesn't exist at all, the same not-found-vs-store-error distinction Get() makes. Implemented as an internal poll of the desk's own store/memory, not a true completion broadcast \u2014 simple and correct, and","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":2,"callees":4,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.Ack@641","file":"deskbox/cmd/agent-desk/queue.go","name":"Ack","kind":"method","line":641,"end":690,"sig":"func (q *Queue) Ack(id string) (*Job, error) {","doc":"Ack marks a terminal job's result seen/handled by the operator \u2014 the other half of the inbox model (ListTerminalUnacked is the inbox; Ack empties it one item at a time). Acking an already-acked job is a no-op, not an error; acking a non-terminal job returns errJobNotTerminal.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":5,"callees":8,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.ListTerminalUnacked@691","file":"deskbox/cmd/agent-desk/queue.go","name":"ListTerminalUnacked","kind":"method","line":691,"end":715,"sig":"func (q *Queue) ListTerminalUnacked(limit int) ([]*Job, error) {","doc":"ListTerminalUnacked returns terminal jobs the operator hasn't acked yet \u2014 the inbox. Store-backed (authoritative, survives restarts) when a store is configured; falls back to scanning in-memory jobs under -store=memory.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":3,"callees":4,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#jobSortTime@716","file":"deskbox/cmd/agent-desk/queue.go","name":"jobSortTime","kind":"function","line":716,"end":724,"sig":"func jobSortTime(j *Job) time.Time {","doc":"jobSortTime is the timestamp ListTerminalUnacked orders by: Finished when set, falling back to Created. A nil Finished isn't just a theoretical case \u2014 comparing against nil in a sort.Slice less-func is not a strict weak ordering (nil reads as \"equal\" to everything), which silently misorders results rather than erroring.","parent":null,"test":false,"nested":false,"module_use":true,"callers":1,"callees":0,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.ListByBatch@725","file":"deskbox/cmd/agent-desk/queue.go","name":"ListByBatch","kind":"method","line":725,"end":745,"sig":"func (q *Queue) ListByBatch(batchID string) ([]*Job, error) {","doc":"ListByBatch returns every job submitted as part of the given batch, in submission order. Store-backed when configured, same fallback as above.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":2,"callees":2,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.WaitForAnyTerminal@746","file":"deskbox/cmd/agent-desk/queue.go","name":"WaitForAnyTerminal","kind":"method","line":746,"end":773,"sig":"func (q *Queue) WaitForAnyTerminal(ctx context.Context, deadline time.Time) ([]*Job, error) {","doc":"WaitForAnyTerminal blocks until at least one terminal-and-unacked job exists, the deadline passes, or ctx is done \u2014 the zero-latency half of the inbox model: park one request here instead of polling ListTerminalUnacked yourself in a loop.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":1,"callees":3,"tested":false,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.persist@774","file":"deskbox/cmd/agent-desk/queue.go","name":"persist","kind":"method","line":774,"end":790,"sig":"func (q *Queue) persist(job *Job) {","doc":"persist is best-effort: a store hiccup must not take down job execution, only degrade the desk's ability to resume after a restart.","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":5,"callees":4,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.persistAck@791","file":"deskbox/cmd/agent-desk/queue.go","name":"persistAck","kind":"method","line":791,"end":802,"sig":"func (q *Queue) persistAck(job *Job) {","doc":"persistAck writes only the ack flag, via JobStore.Ack \u2014 a narrow update deliberately kept separate from persist/Update. Update persists a job's lifecycle fields (status, result, timestamps); Ack persists operator acknowledgment. Sharing one write path between \"the worker finished this job\" and \"the operator acked this job\" is exactly what let one clobber the other (see the comment in finish/finish","parent":"Queue","test":false,"nested":false,"module_use":true,"callers":1,"callees":4,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/queue.go#Queue.Stats@803","file":"deskbox/cmd/agent-desk/queue.go","name":"Stats","ki ":false,"nested":false,"module_use":true,"callers":3,"callees":3,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/seccomp.go#probeSeccomp@153","file":"deskbox/cmd/agent-desk/seccomp.go","name":"probeSeccomp","kind":"function","line":153,"end":200,"sig":"func probeSeccomp(program []byte, settings *Settings, resourceLimitsOK bool) bool {","doc":"probeSeccomp confirms the filter can actually be applied on this box, once, at startup \u2014 the same discipline as canScopeJobs. It runs /bin/true through the exact real invocation (systemd-run scope when resource limits are on, then bwrap with the seccomp fd), so whatever this kernel + bwrap + systemd combination does with the filter and the inherited fd is what the probe reflects. A box where the k","parent":null,"test":false,"nested":false,"module_use":true,"callers":2,"callees":6,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/seccomp.go#withSeccompFlag@201","file":"deskbox/cmd/agent-desk/seccomp.go","name":"withSeccompFlag","kind":"function","line":201,"end":207,"sig":"func withSeccompFlag(args []string, fd int) []string {","doc":"withSeccompFlag inserts `--seccomp <fd>` right after the bwrap binary (args[0]) so it lands among bwrap's own options regardless of any systemd-run prefix added afterward. Kept separate so the daemon's real run path and the startup probe wire the flag in identically.","parent":null,"test":false,"nested":false,"module_use":true,"callers":3,"callees":0,"tested":true,"unused":false},{"id":"deskbox/cmd/agent-desk/seccomp_test.go#TestSeccompProgramWellFormed@15","file":"deskbox/cmd/agent-desk/seccomp_test.go","name":"TestSeccompProgramWellFormed","kind":"function","line":15,"end":36,"sig":"func TestSeccompProgramWellFormed(t *testing.T) {","doc":"TestSeccompProgramWellFormed: the assembled filter must be non-empty and a whole number of struct sock_filter entries (8 bytes each), or bwrap will reject it. Pure \u2014 no kernel, no bwrap \u2014 so it runs everywhere.","parent":nu
