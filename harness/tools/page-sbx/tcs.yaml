name: page-sbx
summary: |
  Reads a web page the way Ryan's own Chrome shows it, signed in as him: the
  sandbox box asks browserbox's gate on win11 to open the URL in a background
  tab, then returns the page's title, visible text (cut at 200,000 characters)
  and up to 50 links, and the tab is closed. Use it for pages that need his
  logins or run JavaScript; settle is how many seconds to let the page load.

input:
  type: object
  additionalProperties: false
  required: [url]
  properties:
    url:    { type: string, minLength: 8, maxLength: 2000 }   # http or https, checked by the gate
    settle: { type: number, minimum: 0, maximum: 20 }

output:
  schema:
    type: object
    additionalProperties: false
    required: [url, title, text, links]
    properties:
      url:   { type: string, maxLength: 4000 }
      title: { type: string, maxLength: 2000 }
      text:  { type: string, maxLength: 200000 }
      links:
        type: array
        maxItems: 50
        items:
          type: object
          additionalProperties: false
          required: [text, href]
          properties:
            text: { type: string, maxLength: 200 }
            href: { type: string, maxLength: 4000 }

allowed_side_effects:
  files: []
  # The stub only talks to the broker over the bound socket. The tool's reach
  # (one host and port: the gate) is the sandbox box's, granted by `net` in
  # tools.list and the core's allowlist.
  network: false

sandbox:
  bind:
    - src: /run/sbx/broker.sock
      dst: /deskbox/broker.sock

execution:
  mode: queued
  max_retries: 0
  timeout_ms: 710000   # sync.py --check: queue (incl. the previous reset) + reset retry + tool + 15 s + margin
