name: glob-sbx
summary: |
  Find files in the sandbox box's workspace (/deskbox/work) by glob pattern,
  e.g. "**/*.py" or "src/*.c", newest first, at most 500. path is the
  directory to search (relative to the workspace, default the workspace).

input:
  type: object
  additionalProperties: false
  required: [pattern]
  properties:
    pattern: { type: string, minLength: 1, maxLength: 1000 }
    path:    { type: string, maxLength: 4096 }

output:
  schema:
    type: object
    additionalProperties: false
    properties:
      files:     { type: array, maxItems: 500, items: { type: string, maxLength: 4200 } }
      truncated: { type: boolean }
      error:     { type: string, maxLength: 4200 }

allowed_side_effects:
  files: []
  network: false     # the stub reaches the broker over the bound socket; the box job itself has no network either

sandbox:
  bind:
    - src: /run/sbx/broker.sock
      dst: /deskbox/broker.sock

execution:
  mode: queued
  max_retries: 0
  timeout_ms: 690000   # sync.py --check: queue (incl. the previous reset) + reset retry + tool + 15 s + margin
