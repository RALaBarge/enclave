name: greet-sbx
summary: |
  greet-python, but executed on the sandbox box via sbx-broker. The contract
  below is the trusted authority: input is validated before it leaves the
  harness, and the sandbox's output is schema-checked before the agent sees it.

input:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:    { type: string, minLength: 1, maxLength: 200 }
    excited: { type: boolean }

output:
  schema:
    type: object
    additionalProperties: false
    required: [greeting, length]
    properties:
      greeting: { type: string, maxLength: 400 }
      length:   { type: integer }

allowed_side_effects:
  files: []
  # No network: the stub reaches the broker over a unix socket that the desk
  # binds in from `sandbox.bind` below. `network: true` would give this job the
  # host netns and with it the core's whole internet, which is not what
  # "call the broker" needs. The stub is a pinned ~90 line file; keep it that
  # way.
  network: false

sandbox:
  bind:
    - src: /run/sbx/broker.sock          # sbx-broker's unix socket
      dst: /deskbox/broker.sock          # where the stub looks for it

execution:
  mode: queued
  max_retries: 0      # the sandbox is reset per run; don't auto-retry
  timeout_ms: 150000
