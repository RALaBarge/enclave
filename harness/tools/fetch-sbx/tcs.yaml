name: fetch-sbx
summary: |
  An HTTP GET made by Ryan's own Chrome, with his cookies for that site: the
  sandbox box asks browserbox's gate on win11, and the browser extension makes
  the request. Returns the response text, cut at 200,000 characters. Use it for
  JSON APIs and plain pages behind his logins; use page-sbx for pages that need
  JavaScript to render.

input:
  type: object
  additionalProperties: false
  required: [url]
  properties:
    url: { type: string, minLength: 8, maxLength: 2000 }   # http or https, checked by the gate

output:
  schema:
    type: object
    additionalProperties: false
    required: [url, body]
    properties:
      url:  { type: string, maxLength: 2000 }
      body: { type: string, maxLength: 200000 }

allowed_side_effects:
  files: []
  # The stub only talks to the broker over the bound socket. The tool's reach
  # (one host and port: the gate) is the sandbox box's, granted by `net` in
  # tools.list and the core's allowlist.
  network: false

sandbox:
  bind:
    - src: /run/sbx/broker.sock
      dst: /deskbox/broker.sock

execution:
  mode: queued
  max_retries: 0
  timeout_ms: 150000
