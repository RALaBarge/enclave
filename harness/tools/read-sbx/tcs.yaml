name: read-sbx
summary: |
  Read a text file from the sandbox box's workspace (/deskbox/work; paths are
  relative to it), as numbered lines like cat -n. offset is the first line
  (1-based), limit the number of lines (default and max 2000); long lines are
  cut at 2000 characters and the whole answer at 250,000. total_lines tells you whether there is more.

input:
  type: object
  additionalProperties: false
  required: [file_path]
  properties:
    file_path: { type: string, minLength: 1, maxLength: 4096 }
    offset:    { type: integer, minimum: 1 }
    limit:     { type: integer, minimum: 1, maximum: 2000 }

output:
  schema:
    type: object
    additionalProperties: false
    properties:
      content:     { type: string, maxLength: 250100 }
      total_lines: { type: integer }
      error:       { type: string, maxLength: 4200 }

allowed_side_effects:
  files: []
  network: false     # the stub reaches the broker over the bound socket; the box job itself has no network either

sandbox:
  bind:
    - src: /run/sbx/broker.sock
      dst: /deskbox/broker.sock

execution:
  mode: queued
  max_retries: 0
  timeout_ms: 680000   # sync.py --check: queue (incl. the previous reset) + reset retry + tool + 15 s + margin
