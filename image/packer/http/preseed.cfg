# sbx Debian 13 (trixie, amd64) unattended install. Served by Packer at /preseed.cfg.
# The build password is NOT in this file. sbx-vm.pkr.hcl passes passwd/user-password{,-again}
# on the kernel command line, which overrides anything here. Cleanup locks that password.

# --- Locale, keyboard, time
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# --- Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string sbx-image
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean false

# --- Mirror
d-i mirror/country string manual
d-i mirror/protocol string http
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free-firmware boolean false

# --- Disk: one ext4 root partition, no swap. Target is /dev/vda (virtio) for qemu.
# msdos label = BIOS boot (qemu's default SeaBIOS). UEFI would need gpt plus an ESP.
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-partitioning/default_label string msdos
d-i partman-auto/expert_recipe string \
    sbx-root :: \
        1 1 -1 ext4 \
            $primary{ } $bootable{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
        .
d-i partman-auto/choose_recipe select sbx-root
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true

# --- Accounts: root login disabled, sbxadmin is the only user and gets sudo via make-user.
# Password comes from the kernel command line (passwd/user-password{,-again}).
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/username string sbxadmin
d-i passwd/user-fullname string sbx admin

# --- Software: only the standard task and ssh-server. provision.sh installs the rest.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
d-i pkgsel/install-language-support boolean false
popularity-contest popularity-contest/participate boolean false

# --- Bootloader: grub to the VM disk only
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/vda

# --- Finish: power off (stage 1 has no SSH communicator; stage 2 boots the installed disk)
d-i debian-installer/exit/poweroff boolean true
d-i finish-install/reboot_in_progress note

# --- Stable NIC name. Without this the installer's net.ifnames=0 is NOT carried into the installed GRUB, so the
# kernel names the NIC ens3/enp0s3 (varies by hypervisor) while /etc/network/interfaces says eth0 -> no network.
d-i debian-installer/add-kernel-opts string net.ifnames=0 biosdevname=0
